<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.lyvawq portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="spotlight"></div>

    <nav class="nav">
        <div class="container">
            <span class="logo">.lyvawq</span>
            <div class="nav-right">
                <button id="theme-toggle">
                    <span class="theme-icon"></span>
                </button>
                <ul class="nav-links">
                    <li><a href="#projects">projects</a></li>
                    <li><a href="#contact">contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <h1 class="reveal">.lyvawq <span class="accent">portfolio</span></h1>
            <p class="reveal">frontend & ui design</p>
            <div class="hidden-hint">type "ghost"</div>
        </div>
    </header>

    <section id="projects" class="projects">
        <div class="container">
            <div class="grid">
                <div class="card reveal">
                    <h3>Personal Portfolio</h3>
                    <p>Minimalist glassmorphism design with interactive features.</p>
                    <div class="tags"><span>HTML</span> <span>CSS</span> <span>JS</span></div>
                </div>
                <div class="card reveal">
                    <h3>Future Project</h3>
                    <p>Coming soon...</p>
                    <div class="tags"><span>React</span></div>
                </div>
            </div>
        </div>
    </section>

    <footer id="contact" class="contact">
        <div class="container reveal">
            <a href="https://t.me/lyvawq" class="btn">Telegram</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
